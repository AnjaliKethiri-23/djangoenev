<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
       <tr>
        <th>pin</th>
        <th>name</th>
        <th>salary</th>
        <th>email</th>
        <th>department</th>
       </tr>
       {%  for x in data %}
       <tr>
           <td>{{x.pin}}</td>
           <td>{{x.name}}</td>
           <td>{{x.salary}}</td>
           <td>{{x.email}}</td>
           <td>{{x.department}}</td>
        </tr>
        {% endfor %}
    </table>    
</body>
</html>
